name: Tarefa
description: Registre uma atividade técnica, operacional ou de documentação.
title: "[TASK] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por registrar esta tarefa. Preencha as informações abaixo para facilitar o planejamento e a execução.

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Descreva claramente o resultado esperado.
      placeholder: O que precisa ser feito e por quê?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique o cenário, a motivação e as informações relevantes.
    validations:
      required: true

  - type: textarea
    id: activities
    attributes:
      label: Atividades
      description: Liste as etapas previstas.
      placeholder: |
        - [ ] Atividade 1
        - [ ] Atividade 2
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de conclusão
      description: Informe as condições que devem ser atendidas para considerar a tarefa concluída.
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependências e impedimentos
      description: Relacione outras issues, equipes, acessos ou riscos envolvidos.
      placeholder: Nenhum.

  - type: dropdown
    id: priority
    attributes:
      label: Prioridade sugerida
      options:
        - Baixa
        - Média
        - Alta
        - Urgente
    validations:
      required: true
